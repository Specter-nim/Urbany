services:

  web:
    image: ${WEB_IMAGE:-urbany/web}:${WEB_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
      USE_POSTGRES: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: urbany_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      SECURE_SSL_REDIRECT: "true"
      SESSION_COOKIE_SECURE: "true"
      CSRF_COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/docs/"]
      interval: 30s
      timeout: 5s
      retries: 10
    depends_on:
      - db
      - redis
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.50"
          memory: 256M

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbany_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  celery:
    image: ${WEB_IMAGE:-urbany/web}:${WEB_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
      USE_POSTGRES: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: urbany_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["celery", "-A", "core", "worker", "-l", "info"]
    depends_on:
      - db
      - redis

  celery_beat:
    image: ${WEB_IMAGE:-urbany/web}:${WEB_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
      USE_POSTGRES: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: urbany_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["celery", "-A", "core", "beat", "-l", "info"]
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  certs:

networks:
  default:
    name: urbany_net
    driver: bridge