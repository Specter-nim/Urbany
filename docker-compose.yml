version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: urbany/web:latest
    env_file:
      - .env.example
    environment:
      DEBUG: "False"
      USE_POSTGRES: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: urbany_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.50"
          memory: 128M

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: urbany_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: urbany/celery:latest
    env_file:
      - .env.example
    environment:
      DEBUG: "False"
      USE_POSTGRES: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: urbany_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["celery", "-A", "core", "worker", "-l", "info"]
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.50"
          memory: 256M

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: urbany/celery-beat:latest
    env_file:
      - .env.example
    environment:
      DEBUG: "False"
      USE_POSTGRES: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: urbany_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["celery", "-A", "core", "beat", "-l", "info"]
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  certs:

networks:
  default:
    name: urbany_net
    driver: bridge